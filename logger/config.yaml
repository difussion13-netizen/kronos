# kronolog — конфигурация логгера

outdir: /var/lib/kronolog          # локальный буфер (.jsonl.gz до выгрузки)
rotate_min: 15                     # период ротации
rotate_max_mb: 256                 # и/или предел размера части
retain_days: 3                     # сколько хранить локально, если S3-выгрузка падает
status_file: /var/lib/kronolog/status.json
kill_idle_s: 1800                  # канарейка (последний эшелон): clob молчит столько —
                                   # flush+S3+exit(1), systemdRestart поднимет. Во время
                                   # троттлинга 15-мин цикл рестартов только укреплял бан,
                                   # поэтому 900 -> 1800; за зависшим socket отвечает pump-watchdog 300с

s3:
  bucket: ""                       # <-- вписать свой, напр. kronolog-data-<user> (тот же регион!)
  prefix: kronolog
  region: eu-west-1
  delete_after_upload: true

streams:
  rtds:                            # Polymarket RTDS: цепные цены (источник резолва)
    enabled: true
    url: wss://ws-live-data.polymarket.com
    chainlink_symbols: [btc/usd, eth/usd, sol/usd, xrp/usd]   # «фильтр — JSON-строка» уже в коде
    binance_symbols: [btcusdt, ethusdt, solusdt, xrpusdt]     # второй источник для лаг-анализа

  clob:                            # CLOB market channel: book/price_change/last_trade
    enabled: true
    url: wss://ws-subscriptions-clob.polymarket.com/ws/market
    gamma: https://gamma-api.polymarket.com
    assets: [btc, eth, sol, xrp]
    intervals:
      - {code: 5m,  seconds: 300}
      - {code: 15m, seconds: 900}
      - {code: 4h,  seconds: 14400}
    lookahead_s: 900               # подписываться и на окна, открывающиеся в ближайшие 15 мин
    discover_every_s: 180          # БЫЛО 45 — после инцидента 16.09 22:0x (edge-троттлинг IP:
                                   # и fresh-клиент отбивается 1013 «slow consumer») молотилка
                                   # из 8 коннектов x цикл 45с = соучастник. 180с — цена: новые
                                   # слоты подцепляются на 2 мин позже, снапшоты всё равно шлёт
                                   # аддитивный subscribe.
    resnapshot_ids: 12             # БЫЛО 6 каждые 45с на 8 коннектах; теперь 12 за 180с —
                                   # полный оборот живых id за ~14 мин вместо ~7, при этом
                                   # pump-watchdog(300с)+reconnect пересылают снапшот сами
    first_data_s: 45               # fresh-подписка не получила НИ ОДНОГО msg за 45с
                                   # => сервер повесил нас в очередь/slow-consumer:
                                   # reconnect + общий exponential cooldown (ConnThrottle),
                                   # а не тихое ожидание idle_timeout
    conn_gap_s: 3.0                # мин. разнос между connect() любых clob-коннектов
                                   # (шквал из 8 одновременных subscribe = snapshot-лавиной
                                   # провоцирует 1013; сериализует ConnThrottle)
    subscribe_template:            # если Polymarket поменяет схему — правим здесь, без кода
      auth: {}
      type: MARKET
      assets_ids: []

  binance:                         # микроструктура спота (для depth-фич; klines/трейды
    enabled: true                  # истории всё равно берём из data.binance.vision)
    url: wss://stream.binance.com:9443/stream
    symbols: [btcusdt, ethusdt, solusdt, xrpusdt]   # 4 актива под датасет (+~60% объёма binance)
    kinds: [aggTrade, kline_1m, depth5@100ms]
